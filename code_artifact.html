<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心晴的壓力救援站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background-color: #f0fdf4;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 md:p-6">

    <div id="game-container" class="bg-white rounded-2xl shadow-xl w-full max-w-3xl p-5 md:p-8 relative overflow-hidden border border-green-100">
        
        <!-- 標題區塊 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-green-700 mb-1">心晴的壓力救援站</h1>
            <p class="text-xs md:text-sm text-gray-500">小五人文科：處理情緒和壓力</p>
        </div>

        <!-- 遊戲主內容區 -->
        <div id="content-area" class="space-y-5">
            <!-- JavaScript 動態填入 -->
        </div>

    </div>

    <script>
        // 12次決策遊戲資料結構 (4大情境 x 3個階段，去標籤化版本)
        const gameData = {
            intro: {
                title: "歡迎來到心晴的壓力救援站",
                narrator: "各位同學，小五學生「心晴」最近在四個不同的生活中遇到了一些狀況，出現了不同的身心反應。請四人小組一起討論，在每個情境中為心晴選擇合適的行動。",
                instruction: "遊戲共有 4 個情境，每個情境需要做出 3 次選擇（共 12 次）。請注意你們每個選擇帶來的「即時後果」。遊戲結束後，請大家根據這些結果，在工作紙上分析心晴的壓力來源、紓緩方法與求助對象。",
                buttonText: "開始救援任務！"
            },
            scenarios: [
                {
                    id: 1,
                    category: "情境一：放學後的課室",
                    bgDescription: "課室裡，桌上堆滿了默書簿、常識專題報告與工作紙，心晴感到頭痛、胃痛，完全無從下手。",
                    steps: [
                        {
                            type: "面對現況",

                            narrator: "心晴看著滿桌的功課發呆，眼眶泛紅。",
                            character: "「我還有好多功課沒做，明天又要默書，我覺得自己一定處理不來……」",
                            options: [
                                { id: 'A', text: "與心晴一起列出所有功課，看看究竟有多少，找出最難和最急的部分。", consequence: "心晴點點頭，發現原來是任務積壓讓她喘不過氣，把困難具體化後，感覺沒那麼可怕了。" },
                                { id: 'B', text: "跟心晴說：「你只是上課沒留心聽書，現在才會覺得這麼難做。」", consequence: "心晴覺得被朋友誤解，心裡更難過委屈，手腳依然冰冷，身心警號並未消除。" },
                                { id: 'C', text: "跟心晴說：「別管了，大家每天都有這麼多功課，習慣了就沒事。」", consequence: "心晴無奈地低頭，壓力並未因朋友的忽視而減少，頭痛和胃痛依然持續。" }
                            ]
                        },
                        {
                            type: "即時行動",
                            title: "步驟 2/3：即時行動",
                            narrator: "焦慮讓心晴無法集中精神，你們會建議她現在立刻做什麼？",
                            character: "「我的腦袋一片混亂，心跳好快，完全無法開始做功課……」",
                            options: [
                                { id: 'A', text: "建議心晴先閉上眼做 3 分鐘深呼吸，喝杯溫水，然後才開始寫。", consequence: "心晴漸漸平復心跳，不再看著整堆功課發愁，焦慮感顯著減輕，終於能動筆。" },
                                { id: 'B', text: "叫心晴把功課推到一邊，先一起玩三小時手機遊戲，忘記煩惱再說。", consequence: "打機時雖然忘記煩惱，但晚上看到功課依然原封不動，心晴的焦慮加倍爆發。" },
                                { id: 'C', text: "陪心晴大聲抱怨學校，甚至把工作紙揉成一團來發洩情緒。", consequence: "情緒發洩後身體更加疲累，被揉皺的工作紙還得想辦法重新寫，增加了新煩惱。" }
                            ]
                        },
                        {
                            type: "後續安排",
                            title: "步驟 3/3：後續安排",
                            narrator: "雖然稍微冷靜了，但專題報告確實超出了心晴目前的個人能力。",
                            character: "「我自己一個人真的做不完，我該怎麼辦？」",
                            options: [
                                { id: 'A', text: "鼓勵心晴明天回校找班主任，坦白說出自己應付不來，請教解題方法。", consequence: "老師了解情況後並沒有責罵，反而給予指導並協助調整進度，心晴如釋重負。" },
                                { id: 'B', text: "叫心晴別告訴任何人，今晚自己熬夜到凌晨四點硬撐做完。", consequence: "心晴體力透支，第二天上課精神不振無法集中，陷入了更差的惡性循環。" },
                                { id: 'C', text: "幫心晴在網上的匿名討論區開帖，發洩對功課太多的不滿。", consequence: "網友給了許多無建設性的留言，無法對心晴的學業提供實質幫助，反而更心煩。" }
                            ]
                        }
                    ]
                },
                {
                    id: 2,
                    category: "情境二：客廳裡的補充練習",
                    bgDescription: "回到家，客廳桌上放滿了媽媽買的補充練習。心晴心跳加速、噁心想吐，拿著筆遲遲未動。",
                    steps: [
                        {
                            type: "面對現況",
                            title: "步驟 1/3：面對現況",
                            narrator: "心晴坐在書桌前拿著筆，手微微發抖。",
                            character: "「我不想做練習，但我更害怕拿不到高分，媽媽會對我失望……」",
                            options: [
                                { id: 'A', text: "問心晴：「你是不是擔心做錯了，媽媽會不高興？」", consequence: "心晴恍然大悟，原來自己不是討厭學習，而是被「害怕令父母失望」的想法束縛了。" },
                                { id: 'B', text: "對她說：「你媽媽要求這麼高，你根本沒有選擇的餘地，快做吧。」", consequence: "心晴感到更加絕望，覺得家庭環境無法改變，內心十分孤立無援。" },
                                { id: 'C', text: "教心晴：「隨便亂填答案就好，反正媽媽也不一定有空仔細檢查。」", consequence: "心晴擔心被發現後會招致更大的責罵，提心吊膽，不安感反而增加。" }
                            ]
                        },
                        {
                            type: "即時行動",
                            title: "步驟 2/3：即時行動",
                            narrator: "面對客廳裡的這份壓力，心晴覺得很不舒服，你們會建議她怎麼做？",
                            character: "「我現在覺得胸口好緊，完全讀不進去，該怎麼辦？」",
                            options: [
                                { id: 'A', text: "建議心晴放下筆，做一些輕柔的伸展運動，聽聽柔和的音樂。", consequence: "身體緊繃的肌肉獲得放鬆，心跳恢復平穩，大腦開始重新清醒過來。" },
                                { id: 'B', text: "給心晴一大包高糖分的零食和薯片，讓她大吃一頓來安慰自己。", consequence: "吃完後胃部更加不適，且產生了罪惡感，無助的情緒反而更加低落。" },
                                { id: 'C', text: "叫心晴直接對家人大聲頂嘴發脾氣，然後把自己鎖在房間裡。", consequence: "引發了嚴重的家庭衝突，客廳氣氛降至冰點，心晴的心理負擔雪上加霜。" }
                            ]
                        },
                        {
                            type: "後續安排",
                            title: "步驟 3/3：後續安排",
                            narrator: "補充練習的問題還是要解決，你們認為心晴該如何處理與家人的關係？",
                            character: "「媽媽回來後一定會檢查，我該怎麼跟她說？」",
                            options: [
                                { id: 'A', text: "鼓勵心晴向父母坦白說出自己的努力與壓力，或請駐校社工幫忙溝通。", consequence: "父母了解心晴的真實負擔後，願意調整練習量，給予精神鼓勵而非責備。" },
                                { id: 'B', text: "教心晴假裝肚子痛說謊逃避，一直躲在房間不出來。", consequence: "說謊帶來了強烈的罪惡感與不安，問題只是被拖延，並未得到真正的解決。" },
                                { id: 'C', text: "叫心晴完全放棄溝通，用冷漠的態度對待父母的任何關心。", consequence: "與家長關係轉冷，缺乏了家庭的支持與愛，心晴感到更加孤單和難受。" }
                            ]
                        }
                    ]
                },
                {
                    id: 3,
                    category: "情境三：小息時的專題分組",
                    bgDescription: "小組討論專題時，心晴與好朋友發生爭執，大家各自組隊。心晴獨自坐在座位上，沒有食慾。",
                    steps: [
                        {
                            type: "面對現況",

                            options: [
                                { id: 'A', text: "引導心晴思考：「你是不是很重視這幾個朋友，怕以後大家都不跟你玩？」", consequence: "心晴意識到自己是因為在乎這段友誼，害怕失去同輩的認同感才會這麼難過。" },
                                { id: 'B', text: "跟心晴一起罵：「都是他們的錯，這群同學太不友善、太壞了！」", consequence: "雖然情緒被憤怒掩蓋，但心底的孤獨與難過並未減少，心晴內心依然受苦。" },
                                { id: 'C', text: "對心晴說：「可能你真的性格不好，沒人喜歡你是正常的，算了吧。」", consequence: "嚴重的自我否定讓心晴自信心全失，甚至出現了想哭和失眠的警號。" }
                            ]
                        },
                        {
                            type: "即時行動",
                            title: "步驟 2/3：即時行動",
                            narrator: "朋友間的爭執讓心晴心裡很不舒服，你們會建議她如何抒發情緒？",
                            character: "「我心裡好難過，眼淚一直流，不知道該怎麼辦……」",
                            options: [
                                { id: 'A', text: "建議心晴拿出一本筆記簿，把心裡的委屈寫下來，或者去操場跑兩圈。", consequence: "運動促進了快樂荷爾蒙分泌，將積壓的委屈文字化後，心情頓時平靜了不少。" },
                                { id: 'B', text: "叫心晴今晚通宵看搞笑短片，試圖讓腦袋停止思考朋友的事。", consequence: "第二天極度疲倦，眼睛乾澀，人際煩惱依然存在，面對同學時更加暴躁。" },
                                { id: 'C', text: "建議心晴在其他同學背後說那幾個朋友的壞話，報復他們。", consequence: "破壞性的行為導致同學間的誤會更深，人際關係徹底惡化，失去更多朋友。" }
                            ]
                        },
                        {
                            type: "後續安排",
                            title: "步驟 3/3：後續安排",
                            narrator: "同學們都在同一個班級，僵局總要打破，你們會建議心晴怎麼做？",
                            character: "「這場誤會越來越大，我該找誰幫忙解開這個結？」",
                            options: [
                                { id: 'A', text: "陪心晴去尋求駐校社工協助，希望能安排一次和平的傾談來解開誤會。", consequence: "社工提供中立的平台，雙方說出心聲解開了誤會，重新建立了友誼。" },
                                { id: 'B', text: "叫心晴忍耐，從此不再跟班上任何同學說話，自己一個人上學。", consequence: "長期封閉自己，錯失了獲得同學支持的機會，情緒日益低落，感到極度孤獨。" },
                                { id: 'C', text: "幫心晴找校外的陌生網友告狀，讓網友幫忙出主意教訓同學。", consequence: "網路陌生人不明真相，給予了偏激的建議，差點引發更大的校園欺凌風波。" }
                            ]
                        }
                    ]
                },
                {
                    id: 4,
                    category: "情境四：禮堂裡的朗誦彩排",
                    bgDescription: "明天就是全港小學朗誦比賽，心晴代表學校參賽。她手心冒汗、頻頻做噩夢，練習時一直犯錯。",
                    steps: [
                        {
                            type: "面對現況",
                            title: "步驟 1/3：面對現況",
                            narrator: "心晴站在禮堂台上練習，聲音微微顫抖。",
                            character: "「明天就要比賽了，如果我拿不到冠軍，學校和大家都會笑我……」",
                            options: [
                                { id: 'A', text: "問心晴：「你是不是覺得如果拿不到冠軍，之前的努力就全白費了？」", consequence: "心晴明白自己過度把焦點放在「輸贏結果」上，這份焦慮讓她無法發揮平時的水平。" },
                                { id: 'B', text: "跟心晴說：「你剛才練習一直出錯，明天大概真的會失敗，做好心理準備吧。」", consequence: "心晴的緊張指數直線上升，信心全無，甚至出現了手心冒汗和發抖的反應。" },
                                { id: 'C', text: "對心晴說：「區區一個比賽而已，根本不重要，隨便念念就算了。」", consequence: "這與心晴心中的真實重視程度不符，這番話完全無法減輕她緊張的感覺。" }
                            ]
                        },
                        {
                            type: "即時行動",
                            title: "步驟 2/3：即時行動",
                            narrator: "比賽前夕，心晴的身體和精神都非常緊繃，你們會建議她今晚怎麼做？",
                            character: "「今晚我緊張得睡不著，心跳好快，該怎麼辦？」",
                            options: [
                                { id: 'A', text: "陪心晴練習腹式呼吸法，並一起對著鏡子說：「我已經準備得很好了！」", consequence: "身體的神經系統逐漸放鬆，心跳放緩，當晚心晴得以獲得良好的睡眠與休息。" },
                                { id: 'B', text: "叫心晴今晚不睡覺，連夜練習朗誦到凌晨四點，確保每個字都完美。", consequence: "體力與聲線過度消耗，第二天比賽時精神恍惚、喉嚨沙啞，反而更容易出錯。" },
                                { id: 'C', text: "建議心晴衝著父母發脾氣，哭鬧著明天絕對不要去參加比賽。", consequence: "情緒失控消耗了寶貴的精力，而且並未為明天的比賽做好任何心理建設。" }
                            ]
                        },
                        {
                            type: "後續安排",
                            title: "步驟 3/3：後續安排",
                            narrator: "到了比賽當天，如果心晴臨上台前依然很緊張，你們會建議她找誰幫忙？",
                            character: "「快輪到我上台了，我的手還是一直發抖……」",
                            options: [
                                { id: 'A', text: "鼓勵心晴向負責指導的朗誦老師傾訴，請老師分享臨場放鬆的小技巧。", consequence: "老師給予溫暖的鼓勵並分享了自己以前比賽的經驗，讓心晴重新建立起信心。" },
                                { id: 'B', text: "叫心晴隱瞞緊張，明天上台前裝病躲在洗手間，逃避出賽。", consequence: "逃避比賽帶來了長久的遺憾與內疚，心晴也未能建立起面對挑戰的勇氣。" },
                                { id: 'C', text: "建議心晴上網尋找偏方，例如偷喝大人的咖啡或吃不知名的提神藥丸。", consequence: "這是危險且不科學的做法，不僅沒有幫助放鬆，更可能嚴重損害身體健康。" }
                            ]
                        }
                    ]
                }
            ]
        };

        // 遊戲狀態
        let currentScenarioIdx = 0;
        let currentStepIdx = 0;
        let userRecords = [];

        const contentArea = document.getElementById('content-area');

        // 渲染導言
        function renderIntro() {
            contentArea.innerHTML = `
                <div class="fade-in space-y-4">
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg">
                        <p class="text-gray-800 font-bold mb-1">${gameData.intro.title}</p>
                        <p class="text-gray-700 text-sm md:text-base leading-relaxed">${gameData.intro.narrator}</p>
                    </div>

                    <div class="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-lg">
                        <p class="text-amber-800 font-bold text-xs md:text-sm">任務說明：</p>
                        <p class="text-gray-700 text-sm leading-relaxed">${gameData.intro.instruction}</p>
                    </div>

                    <div class="text-center pt-4">
                        <button onclick="startGame()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 transform hover:scale-105">
                            ${gameData.intro.buttonText}
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame() {
            currentScenarioIdx = 0;
            currentStepIdx = 0;
            userRecords = [];
            renderStep();
        }

        // 渲染當前步驟
        function renderStep() {
            const scenario = gameData.scenarios[currentScenarioIdx];
            const step = scenario.steps[currentStepIdx];
            const globalStepNum = (currentScenarioIdx * 3) + currentStepIdx + 1; 

            let html = `
                <div class="fade-in space-y-4">
                    <!-- 進度與類別標題 -->
                    <div class="flex flex-col md:flex-row md:items-center justify-between border-b pb-2 gap-2">
                        <div>
                            <span class="bg-green-100 text-green-800 text-xs font-bold px-2.5 py-1 rounded-full mr-2">
                                ${scenario.category}
                            </span>
                            <span class="text-xs font-semibold text-gray-500">
                                全局進度：${globalStepNum} / 12
                            </span>
                        </div>
                        <div class="text-xs text-green-600 font-bold">
                            情境 ${currentScenarioIdx + 1}/4 ｜ ${step.title}
                        </div>
                    </div>

                    <!-- 情境背景 -->
                    ${currentStepIdx === 0 ? `
                        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs md:text-sm text-emerald-900">
                            <strong>📍 情境背景：</strong>${scenario.bgDescription}
                        </div>
                    ` : ''}

                    <!-- 旁白與主角對話 -->
                    <div class="bg-blue-50 border-l-4 border-blue-400 p-3 rounded-r-lg text-sm">
                        <p class="text-blue-900 font-semibold">旁白：</p>
                        <p class="text-gray-700">${step.narrator}</p>
                    </div>

                    <div class="bg-pink-50 border-l-4 border-pink-400 p-3 rounded-r-lg text-sm">
                        <p class="text-pink-800 font-semibold">心晴：</p>
                        <p class="text-gray-700 italic">「${step.character}」</p>
                    </div>

                    <!-- 選項區域 -->
                    <div class="pt-2">
                        <p class="font-bold text-gray-800 text-sm md:text-base mb-3">請小組討論，你們會建議心晴怎麼做？</p>
                        <div class="space-y-2.5">
            `;

            step.options.forEach(opt => {
                html += `
                    <button onclick="makeChoice('${opt.id}')" class="w-full text-left bg-white hover:bg-green-50 border border-gray-200 hover:border-green-400 p-3.5 rounded-xl shadow-sm transition duration-200 flex items-start group">
                        <span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-gray-100 text-gray-700 font-bold mr-3 group-hover:bg-green-600 group-hover:text-white transition duration-200 shrink-0 text-sm">
                            ${opt.id}
                        </span>
                        <span class="text-gray-700 text-xs md:text-sm pt-0.5 leading-relaxed">${opt.text}</span>
                    </button>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>
            `;

            contentArea.innerHTML = html;
        }

        // 處理選擇與後果顯示
        function makeChoice(choiceId) {
            const scenario = gameData.scenarios[currentScenarioIdx];
            const step = scenario.steps[currentStepIdx];
            const selectedOpt = step.options.find(o => o.id === choiceId);

            userRecords.push({
                scenarioId: scenario.id,
                scenarioCategory: scenario.category,
                stepType: step.type,
                choiceId: choiceId,
                choiceText: selectedOpt.text,
                consequence: selectedOpt.consequence
            });

            let html = `
                <div class="fade-in space-y-4">
                    <h2 class="text-lg md:text-xl font-bold text-gray-800 border-b pb-2">選擇後果反思</h2>
                    
                    <div class="bg-gray-50 border border-gray-200 p-3.5 rounded-xl text-xs md:text-sm">
                        <p class="text-gray-500 mb-1">你們的建議 (${choiceId})：</p>
                        <p class="text-gray-800 font-medium">${selectedOpt.text}</p>
                    </div>

                    <div class="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-lg shadow-sm">
                        <p class="text-amber-900 font-bold text-sm mb-1">即時影響與結果：</p>
                        <p class="text-gray-800 text-sm md:text-base leading-relaxed">${selectedOpt.consequence}</p>
                    </div>

                    <div class="text-center pt-4">
                        <button onclick="nextStep()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-7 rounded-full shadow-md transition duration-200 transform hover:scale-105">
                            繼續前往下一步 ➔
                        </button>
                    </div>
                </div>
            `;

            contentArea.innerHTML = html;
        }

        // 移動至下一步驟
        function nextStep() {
            currentStepIdx++;
            if (currentStepIdx >= 3) {
                currentStepIdx = 0;
                currentScenarioIdx++;
            }

            if (currentScenarioIdx < gameData.scenarios.length) {
                renderStep();
            } else {
                renderSummary();
            }
        }

        // 遊戲結束：工作紙謄寫總結頁面
        function renderSummary() {
            let summaryHTML = `
                <div class="fade-in space-y-5">
                    <div class="text-center">
                        <span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full">救援任務結束</span>
                        <h2 class="text-2xl font-bold text-green-700 mt-2">小組決策總結紀錄</h2>
                        <p class="text-xs md:text-sm text-gray-600 mt-1">請參考你們的選擇結果，討論並完成實體工作紙。</p>
                    </div>

                    <div class="space-y-4 max-h-[420px] overflow-y-auto pr-1">
            `;

            gameData.scenarios.forEach((sc) => {
                const scRecords = userRecords.filter(r => r.scenarioId === sc.id);
                summaryHTML += `
                    <div class="border border-green-200 rounded-xl p-3.5 bg-green-50/50 shadow-sm">
                        <h3 class="font-bold text-green-800 text-sm border-b border-green-200 pb-1.5 mb-2">${sc.category}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
                `;

                scRecords.forEach(r => {
                    summaryHTML += `
                        <div class="bg-white p-2.5 rounded-lg border border-gray-100 shadow-2xs">
                            <span class="font-bold text-gray-700 block mb-1">【${r.stepType}】</span>
                            <p class="text-gray-600 leading-snug mb-1.5">建議：${r.choiceText}</p>
                            <p class="text-amber-800 text-[11px] bg-amber-50 p-1.5 rounded"><b>結果：</b>${r.consequence}</p>
                        </div>
                    `;
                });

                summaryHTML += `
                        </div>
                    </div>
                `;
            });

            summaryHTML += `
                    </div>

                    <!-- 引導學生填寫工作紙的問題提示 -->
                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-xs md:text-sm space-y-2">
                        <p class="font-bold text-blue-900">📝 工作紙討論任務：</p>
                        <p class="text-gray-700 mb-2">請小組回顧剛才的 12 個情境結果，為心晴分析：</p>
                        <ol class="list-decimal list-inside space-y-1 text-gray-700 ml-2">
                            <li>她在這 4 個情境中的<b>真正壓力來源</b>分別是什麼？</li>
                            <li>你們認為哪些<b>紓緩行動</b>是有效且健康的？</li>
                            <li>她最終應該向哪些<b>合適的對象</b>尋求協助？</li>
                        </ol>
                    </div>

                    <div class="text-center pt-2">
                        <button onclick="startGame()" class="text-green-700 hover:text-green-900 text-xs font-semibold underline">
                            ↺ 重新嘗試不同選擇
                        </button>
                    </div>
                </div>
            `;

            contentArea.innerHTML = summaryHTML;
        }

        // 初始化
        window.onload = () => {
            renderIntro();
        };
    </script>
</body>
</html>
